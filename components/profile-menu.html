<div aria-label="Profile menu" class="profile-menu hidden" id="profileMenu" role="dialog">
<div class="profile-card-head">
<div class="profile-avatar"><iconify-icon icon="solar:user-bold-duotone"></iconify-icon></div>
<div><b id="profileName">Caregiver</b><small id="profileEmail">Enter your email</small></div>
</div>
<div class="profile-divider"></div>
<button class="profile-action hidden" id="installBtn"><iconify-icon icon="solar:download-minimalistic-bold-duotone"></iconify-icon><span>Install app</span><iconify-icon class="chev" icon="solar:alt-arrow-right-bold-duotone"></iconify-icon></button>
<div class="profile-theme-row">
<div class="profile-theme-label"><iconify-icon icon="solar:sun-2-bold-duotone"></iconify-icon><span>Appearance</span></div>
<div aria-label="Theme" class="segmented theme-control" id="themeControl">
<button aria-label="Light mode" aria-pressed="true" data-theme="light" title="Light mode" type="button"><iconify-icon icon="solar:sun-2-bold-duotone"></iconify-icon></button>
<button aria-label="Dark mode" aria-pressed="false" data-theme="dark" title="Dark mode" type="button"><iconify-icon icon="solar:moon-bold-duotone"></iconify-icon></button>
</div>
</div>
<div class="profile-divider profile-divider-bottom"></div>
<button class="profile-action danger" id="profileLogoutBtn"><iconify-icon icon="solar:logout-2-bold-duotone"></iconify-icon><span>Sign out</span></button>
</div>
