<div aria-labelledby="familyAccessTitle" aria-modal="true" class="modal-overlay hidden" id="familyAccessModal" role="dialog">
<div class="form-modal">
<div class="form-modal-head"><div><h3 id="familyAccessTitle">Add family member</h3></div><button aria-label="Close" class="icon-btn modal-close" id="closeFamilyAccess" type="button"><iconify-icon icon="solar:close-circle-bold-duotone"></iconify-icon></button></div>
<p class="form-modal-copy">They will be able to view this device’s location reports and obstacle alerts.</p>
<label class="modal-field-label" for="familyEmailInput">Email address</label>
<input autocomplete="email" class="modal-input" id="familyEmailInput" placeholder="name@example.com" type="email"/>
<div class="modal-actions"><button class="secondary-btn" id="cancelFamilyAccess" type="button">Cancel</button><button class="primary-btn" id="confirmFamilyAccess" type="button">Add member</button></div>
</div>
</div>
