<section class="page-section" id="events">
<div class="section-heading"><p>Obstacle events recorded by the smart glasses and sent to this dashboard.</p></div>
<div class="alert-summary"><div><span>Detections today</span><strong id="alertsTodayCount">—</strong></div><div><span>All-time detections</span><strong id="alertsTotal">—</strong></div><div><span>Latest detection</span><strong id="latestAlertText">None</strong></div></div>
<div class="filter-row"><input class="search-input" id="eventSearch" placeholder="Search alerts…"/><div class="custom-select" id="severityPicker"><button aria-expanded="false" aria-haspopup="listbox" class="custom-select-trigger" id="severityPickerTrigger" type="button"><span id="severityPickerLabel">All alerts</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button><div aria-label="Alert severity" class="custom-select-menu" id="severityPickerMenu" role="listbox"><button aria-selected="true" class="custom-option active" data-value="all" role="option" type="button"><span>All alerts</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="High" role="option" type="button"><span>More urgent</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="Medium" role="option" type="button"><span>Moderate</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="Low" role="option" type="button"><span>Less urgent</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button></div><input id="severityFilter" type="hidden" value="all"/></div><div class="custom-select" id="rangePicker"><button aria-expanded="false" aria-haspopup="listbox" class="custom-select-trigger" id="rangePickerTrigger" type="button"><span id="rangePickerLabel">All time</span><iconify-icon icon="solar:alt-arrow-down-bold-duotone"></iconify-icon></button><div aria-label="Date range" class="custom-select-menu" id="rangePickerMenu" role="listbox"><button aria-selected="true" class="custom-option active" data-value="all" role="option" type="button"><span>All time</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="1" role="option" type="button"><span>Last 24 hours</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="7" role="option" type="button"><span>Last 7 days</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="30" role="option" type="button"><span>Last 30 days</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button><button aria-selected="false" class="custom-option" data-value="90" role="option" type="button"><span>Last 90 days</span><iconify-icon icon="solar:check-circle-bold-duotone"></iconify-icon></button></div><input id="rangeFilter" type="hidden" value="all"/></div><button class="secondary-btn" id="clearFilterBtn" type="button">Reset</button></div>
<div class="panel table-panel"><div class="table-wrap" id="eventsTable"></div><div class="load-more"><span id="alertsShown"></span><button class="secondary-btn hidden" id="loadMoreBtn" type="button">Show more</button></div></div>
</section>
