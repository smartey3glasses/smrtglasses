<script>
window.setTimeout(() => {
  const loading = document.getElementById('glassesLoading');
  const error = document.getElementById('glassesError');
  if (loading && !loading.classList.contains('hidden')) {
    loading.classList.add('hidden');
    if (error) {
      error.textContent = '3D preview could not start. Check the viewer files and internet connection, then refresh.';
      error.classList.remove('hidden');
    }
  }
}, 15000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
